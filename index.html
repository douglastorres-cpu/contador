<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Incidencias</title>
<script>try { const t = localStorage.getItem("tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
  /* Layout: tablero de incidencias — cabecera, pestañas por departamento, paneles por persona que se apilan en móvil. */
  :root {
    --bg: #eceae4;
    --panel: #fbfaf7;
    --ink: #17161a;
    --muted: #625f58;
    --line: #d4d0c6;
    --hazard: #f2b705;
    --hazard-ink: #17161a;
    --plus: #1f7a3a;
    --minus: #b3261e;
    --lead-bg: #fff3c4;
    --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141417; --panel: #1e1e22; --ink: #f0eee8; --muted: #a29f97; --line: #34343a;
      --hazard: #f2b705; --hazard-ink: #17161a; --plus: #4caf6a; --minus: #e5554b; --lead-bg: #3a3014;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141417; --panel: #1e1e22; --ink: #f0eee8; --muted: #a29f97; --line: #34343a;
    --hazard: #f2b705; --hazard-ink: #17161a; --plus: #4caf6a; --minus: #e5554b; --lead-bg: #3a3014;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 0 40px;
  }
  .tape {
    height: 10px;
    margin-inline: -16px;
    background: repeating-linear-gradient(-45deg, var(--hazard) 0 18px, var(--hazard-ink) 18px 36px);
  }
  .wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-top: 28px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5.5vw, 2.8rem);
    line-height: .95;
    text-transform: uppercase;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; }
  .sub { margin: 6px 0 0; color: var(--muted); }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-mode="live"] .dot { background: var(--plus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--plus) 25%, transparent); }
  .status[data-mode="offline"] .dot { background: var(--hazard); }

  /* Pestañas */
  .tabs-scroll { overflow-x: auto; overflow-y: hidden; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
  .tabs-scroll::-webkit-scrollbar { display: none; }
  .tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); min-width: max-content; }
  .tab {
    font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
    background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
    padding: 10px 12px; margin-bottom: -2px; border-radius: 0; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hazard); }
  .tab .n { font-family: var(--font-num); font-size: .75rem; background: var(--line); color: var(--ink); border-radius: 10px; padding: 1px 7px; }

  .module-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .add { display: flex; gap: 8px; flex-wrap: wrap; }
  .add input, .field input, .field textarea {
    font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--ink); min-width: 0; width: 220px; max-width: 100%;
  }
  .add input:focus-visible, .field input:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--hazard); outline-offset: 1px; }
  .header-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

  /* Ventanas emergentes */
  dialog {
    width: min(480px, calc(100% - 32px)); max-height: calc(100% - 48px);
    border: 2px solid var(--line); border-radius: 8px; padding: 0;
    background: var(--panel); color: var(--ink);
  }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  .modal { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
  .modal h2 { font-size: 1.1rem; overflow-wrap: anywhere; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-weight: 700; font-size: .9rem; }
  .field input, .field textarea { width: 100%; }
  .field textarea { min-height: 110px; resize: vertical; line-height: 1.4; }
  .hint { color: var(--muted); font-size: .8rem; }
  .error { color: var(--minus); font-size: .85rem; font-weight: 600; }
  .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .modal .block { width: 100%; padding: 12px; font-size: 1rem; }
  .inc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow: auto; }
  .inc-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .inc-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .inc-title { font-weight: 700; overflow-wrap: anywhere; }
  .inc-meta { color: var(--muted); font-size: .8rem; }
  .inc-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .inc-actions button { padding: 6px 10px; font-size: .8rem; }

  /* Reportes */
  .report-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink); border-radius: 0; padding: 7px 12px; font-size: .85rem; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .period { font-weight: 700; min-width: 0; }
  .icon-btn { background: transparent; color: var(--ink); border: 2px solid var(--line); padding: 5px 11px; font-size: 1rem; }
  td.reason { white-space: normal; min-width: 220px; overflow-wrap: anywhere; }
  td.muted { color: var(--muted); }

  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .empty {
    border: 2px dashed var(--line); border-radius: 6px; padding: 28px 18px; text-align: center; color: var(--muted);
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 6px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: background-color .2s, border-color .2s;
  }
  .panel.lead { background: var(--lead-bg); border-color: var(--hazard); }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; }
  .name { font-family: var(--font-display); font-size: 1.15rem; text-transform: uppercase; overflow-wrap: break-word; max-width: 100%; }
  .tag {
    font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--hazard); color: var(--hazard-ink); padding: 3px 7px; border-radius: 3px; white-space: nowrap;
  }
  .count {
    font-family: var(--font-num); font-weight: 800;
    font-size: clamp(3rem, 10vw, 4.2rem); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .count small { font-family: var(--font-body); font-size: .85rem; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .last { color: var(--muted); font-size: .85rem; min-height: 1.2em; }
  .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 5px;
    padding: 11px 10px; font-weight: 700; color: #fff;
    transition: transform .08s, opacity .2s;
  }
  button:focus-visible, .tab:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .minus { background: var(--minus); font-size: 1.4rem; line-height: 1; }
  .plus { background: var(--plus); font-size: .95rem; }
  .primary { background: var(--ink); color: var(--bg); padding: 9px 14px; font-size: .9rem; }
  .ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); padding: 8px 14px; font-size: .9rem; }
  .danger { background: var(--minus); padding: 8px 14px; font-size: .9rem; }
  .link { background: transparent; color: var(--muted); padding: 2px 0; font-size: .8rem; font-weight: 600; text-decoration: underline; justify-self: start; }
  .remove-area { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .85rem; }
  .remove-area .danger, .remove-area .ghost { padding: 5px 10px; font-size: .8rem; }

  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 2px solid var(--line); padding-top: 16px; }
  .total { font-weight: 600; }
  .total b { font-family: var(--font-num); }
  .reset-area { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }

  /* Resumen */
  .table-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 6px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  td.num, th.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  td a { color: var(--ink); font-weight: 700; }

  .bump { animation: bump .25s ease; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .bump { animation: none; } button { transition: none; } }
  /* Histórico */
  .stats { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stats .label { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px;
    font-size: .8rem; font-weight: 700; color: var(--ink); background: var(--bg);
  }
  .chip b { font-family: var(--font-num); font-size: .95rem; }
  .section { display: flex; flex-direction: column; gap: 10px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h3 { margin: 0; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .days { max-height: 440px; overflow: auto; }
  thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  tr.sel td { background: var(--lead-bg); }
  .daybtn { background: transparent; color: var(--ink); padding: 0; font-weight: 700; text-decoration: underline; text-align: left; }
  td.zero { color: var(--muted); }
  tfoot th { color: var(--ink); font-size: .85rem; border-top: 2px solid var(--line); }
  .bar { display: inline-block; height: 10px; border-radius: 2px; background: var(--hazard); vertical-align: middle; margin-right: 8px; }
</style>
</head>
<body>

<div class="tape" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Registro de Incidencias</h1>
      <p class="sub">Seguimiento en tiempo real de incidencias por departamento. Horario de Perú.</p>
    </div>
    <div class="header-right">
      <span class="status" id="status" data-mode="connecting"><span class="dot"></span><span id="status-text">Conectando…</span></span>
      <button class="ghost" id="theme" type="button"></button>
    </div>
  </header>

  <div class="tabs-scroll"><nav class="tabs" id="tabs" role="tablist" aria-label="Departamentos"></nav></div>

  <main id="view"></main>
  <p class="note" id="note"></p>
</div>

<dialog id="modal"></dialog>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, update, set, push, remove, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Configuración pública del proyecto de Firebase (no es secreta: la seguridad
  // la ponen las reglas de la base de datos, ver database.rules.json).
  const firebaseConfig = {
    apiKey: "AIzaSyCfGjbzeQgHqwhSleO0Xp9QRadoDM2zfRc",
    authDomain: "contador-eaa71.firebaseapp.com",
    databaseURL: "https://contador-eaa71-default-rtdb.firebaseio.com",
    projectId: "contador-eaa71",
    storageBucket: "contador-eaa71.firebasestorage.app",
    messagingSenderId: "6428742945",
    appId: "1:6428742945:web:d1404af3e38c9b4f785a60",
  };

  // Departamentos. Para añadir uno nuevo, añádelo aquí y en database.rules.json.
  const MODULES = [
    { key: "sistemas", name: "Sistemas" },
    { key: "comercial", name: "Comercial" },
    { key: "marketing", name: "Marketing" },
    { key: "captacion", name: "Captación" },
    { key: "ventas", name: "Ventas" },
    { key: "alquiler", name: "Alquiler" },
  ];
  const SUMMARY = "resumen";
  const MAX_NAME = 40;
  const MAX_REASON = 300;
  const LEGACY_REASON = "Registrada antes del histórico";

  // ---- fechas en hora de Perú ----
  // Perú es UTC-5 todo el año (no hay horario de verano). El día va de 00:00 a
  // 00:00 hora de Perú; «Hoy» empieza de cero cada día y todo queda en el histórico.
  const PERU_OFFSET_MS = -5 * 3600 * 1000;
  const DAY_MS = 86400000;
  const peru = t => new Date(t + PERU_OFFSET_MS);
  const dayKey = t => peru(t).toISOString().slice(0, 10);   // "2026-10-02"
  const hourOf = t => peru(t).getUTCHours();
  const keyDate = k => new Date(k + "T00:00:00Z");
  const addDays = (k, n) => new Date(keyDate(k).getTime() + n * DAY_MS).toISOString().slice(0, 10);
  const fmtDay = new Intl.DateTimeFormat("es-PE", { weekday: "short", day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
  const fmtDayMonth = new Intl.DateTimeFormat("es-PE", { day: "numeric", month: "long", timeZone: "UTC" });
  const fmtMonth = new Intl.DateTimeFormat("es-PE", { month: "long", year: "numeric", timeZone: "UTC" });
  const fmtWhen = new Intl.DateTimeFormat("es-PE", { weekday: "short", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/Lima" });
  const dayLabel = k => fmtDay.format(keyDate(k));
  const when = t => fmtWhen.format(new Date(t));
  const pad = n => String(n).padStart(2, "0");
  const hourLabel = hr => `${pad(hr)}:00 – ${pad((hr + 1) % 24)}:00`;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // Periodo de un reporte: [primer día, último día] (ambos incluidos)
  function periodRange(kind, anchor) {
    if (kind === "dia") return { start: anchor, end: anchor, label: dayLabel(anchor) };
    if (kind === "semana") {
      const dow = (keyDate(anchor).getUTCDay() + 6) % 7;          // lunes = 0
      const start = addDays(anchor, -dow), end = addDays(start, 6);
      return { start, end, label: `Semana del ${fmtDayMonth.format(keyDate(start))} al ${fmtDayMonth.format(keyDate(end))} de ${end.slice(0, 4)}` };
    }
    const start = anchor.slice(0, 8) + "01";
    const d = keyDate(start); d.setUTCMonth(d.getUTCMonth() + 1);
    const end = addDays(d.toISOString().slice(0, 10), -1);
    return { start, end, label: cap(fmtMonth.format(keyDate(start))) };
  }
  function shiftPeriod(kind, anchor, dir) {
    if (kind === "dia") return addDays(anchor, dir);
    if (kind === "semana") return addDays(anchor, 7 * dir);
    const d = keyDate(anchor.slice(0, 8) + "01"); d.setUTCMonth(d.getUTCMonth() + dir);
    return d.toISOString().slice(0, 10);
  }

  // ---- tema (día / noche), guardado en este navegador ----
  const themeBtn = document.getElementById("theme");
  const darkMq = window.matchMedia("(prefers-color-scheme: dark)");
  const currentTheme = () => document.documentElement.dataset.theme || (darkMq.matches ? "dark" : "light");
  function paintThemeBtn() {
    const dark = currentTheme() === "dark";
    themeBtn.textContent = dark ? "☀ Modo día" : "☾ Modo noche";
    themeBtn.setAttribute("aria-label", dark ? "Cambiar a modo día" : "Cambiar a modo noche");
  }
  themeBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("tema", next); } catch (e) {}
    paintThemeBtn();
  });
  darkMq.addEventListener?.("change", paintThemeBtn);
  paintThemeBtn();

  const db = getDatabase(initializeApp(firebaseConfig));

  // equipos/<modulo>/personas/<id> = { nombre, creado, activo }
  // equipos/<modulo>/eventos/<id>  = { persona, t, razon? }   (una incidencia cada uno)
  let data = {};
  let loaded = false;
  let connected = false;
  let serverOffset = 0;
  let active = SUMMARY;
  let pendingRemove = null;          // persona con confirmación de «Quitar persona» abierta
  let selectedDay = {};              // modulo -> día elegido en «Por hora»
  let search = {};                   // modulo -> texto del buscador
  let report = { kind: "dia", anchor: null };
  let lastShown = {};
  let modal = null;                  // { kind: "minus", mod, pid, confirm } mientras está abierto
  const migrating = new Set();

  const now = () => Date.now() + serverOffset;
  const today = () => dayKey(now());

  const $ = id => document.getElementById(id);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid);
    return el;
  };
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

  // ---- datos derivados ----
  function model(mod) {
    const raw = data[mod] || {};
    const td = today();
    const persons = Object.entries(raw.personas || {})
      .map(([id, p]) => ({ id, mod, nombre: String(p.nombre || "Sin nombre"), creado: Number(p.creado) || 0, activo: p.activo !== false, total: 0, hoy: 0, last: 0, events: [] }))
      .sort((a, b) => a.creado - b.creado || a.id.localeCompare(b.id));
    const byId = Object.fromEntries(persons.map(p => [p.id, p]));
    const days = {};
    const events = [];
    for (const [eid, e] of Object.entries(raw.eventos || {})) {
      const p = byId[e.persona]; const t = Number(e.t);
      if (!p || !t) continue;
      const ev = { id: eid, mod, persona: p, t, razon: typeof e.razon === "string" ? e.razon.trim() : "" };
      events.push(ev); p.events.push(ev);
      p.total++;
      if (t > p.last) p.last = t;
      const dk = dayKey(t), hr = hourOf(t);
      if (dk === td) p.hoy++;
      const d = days[dk] ||= { _total: 0, hours: {} };
      d[p.id] = (d[p.id] || 0) + 1; d._total++;
      const hh = d.hours[hr] ||= { _total: 0 };
      hh[p.id] = (hh[p.id] || 0) + 1; hh._total++;
    }
    for (const p of persons) p.events.sort((a, b) => a.t - b.t || a.id.localeCompare(b.id));
    const totalHist = persons.reduce((s, p) => s + p.total, 0);
    const totalHoy = persons.reduce((s, p) => s + p.hoy, 0);
    return { persons, active: persons.filter(p => p.activo), days, events, totalHist, totalHoy };
  }

  function ago(t) {
    if (!t) return "Sin incidencias";
    const s = Math.max(0, Math.round((now() - t) / 1000));
    if (s < 60) return "Última: hace un momento";
    const m = Math.round(s / 60);
    if (m < 60) return `Última: hace ${m} min`;
    const hrs = Math.round(m / 60);
    if (hrs < 24) return `Última: hace ${hrs} h`;
    return `Última: hace ${Math.round(hrs / 24)} días`;
  }

  function fail(err) {
    console.error(err);
    $("note").textContent = err && /permission/i.test(String(err.code || err.message))
      ? "La base de datos ha rechazado el cambio. Revisa las reglas de Firebase (database.rules.json)."
      : "No se pudo guardar el cambio. Comprueba la conexión y vuelve a intentarlo.";
  }
  const ok = () => { $("note").textContent = ""; };

  // ---- acciones ----
  function plus(mod, id, razon) {
    const ev = { persona: id, t: serverTimestamp() };
    razon = razon.trim().slice(0, MAX_REASON);
    if (razon) ev.razon = razon;
    set(push(ref(db, `equipos/${mod}/eventos`)), ev).then(ok, fail);
  }
  function removeEvent(mod, eid) {
    remove(ref(db, `equipos/${mod}/eventos/${eid}`)).then(ok, fail);
  }
  function addPerson(mod, nombre) {
    const archived = model(mod).persons.find(p => !p.activo && norm(p.nombre) === norm(nombre));
    if (archived) return update(ref(db, `equipos/${mod}/personas/${archived.id}`), { activo: true }).then(ok, fail);
    return set(push(ref(db, `equipos/${mod}/personas`)), { nombre, creado: serverTimestamp(), activo: true }).then(ok, fail);
  }
  // Quitar a una persona la oculta del marcador pero conserva su histórico.
  function archivePerson(mod, id) {
    pendingRemove = null;
    update(ref(db, `equipos/${mod}/personas/${id}`), { activo: false }).then(ok, fail);
  }

  // La versión anterior guardaba un número («count») sin fechas. La primera vez
  // que alguien abre la página lo convierte en incidencias del histórico. La
  // transacción garantiza que solo un navegador hace la conversión.
  async function migrateLegacy() {
    for (const m of MODULES) {
      for (const [id, p] of Object.entries(data[m.key]?.personas || {})) {
        if (!(Number(p.count) > 0) || migrating.has(m.key + id)) continue;
        migrating.add(m.key + id);
        let prev = 0;
        try {
          const res = await runTransaction(ref(db, `equipos/${m.key}/personas/${id}/count`), v => {
            prev = Number(v) || 0;
            return prev > 0 ? 0 : undefined;
          });
          if (!res.committed || prev <= 0) continue;
          const t = Number(p.last) || Number(p.creado) || now();
          const changes = {};
          for (let i = 0; i < prev; i++) changes[push(ref(db, `equipos/${m.key}/eventos`)).key] = { persona: id, t, razon: LEGACY_REASON };
          await update(ref(db, `equipos/${m.key}/eventos`), changes);
        } catch (e) { console.error(e); }
      }
    }
  }

  // ---- ventanas emergentes ----
  const dlg = $("modal");
  dlg.addEventListener("close", () => { modal = null; });
  function openDialog(content) {
    dlg.replaceChildren(content);
    if (!dlg.open) dlg.showModal();
  }
  function closeDialog() { if (dlg.open) dlg.close(); modal = null; }

  function openPlus(p) {
    modal = { kind: "plus" };
    const ta = h("textarea", { id: "razon", maxlength: String(MAX_REASON), placeholder: "Ej.: No hubo suficiente comunicación con el cliente" });
    const form = h("form", { class: "modal", onsubmit: e => { e.preventDefault(); plus(p.mod, p.id, ta.value); closeDialog(); } },
      h("h2", {}, `Nueva incidencia · ${p.nombre}`),
      h("div", { class: "field" },
        h("label", { for: "razon" }, "Razón:"), ta,
        h("span", { class: "hint" }, "Opcional. Aparecerá en los reportes diarios, semanales y mensuales.")),
      h("div", { class: "modal-actions" },
        h("button", { type: "button", class: "ghost", onclick: closeDialog }, "Cancelar"),
        h("button", { type: "submit", class: "plus" }, "Registrar incidencia")));
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
    openDialog(form);
    ta.focus();
  }

  function openAdd(mod) {
    modal = { kind: "add" };
    const input = h("input", { id: "nuevo-nombre", type: "text", maxlength: String(MAX_NAME), autocomplete: "off", placeholder: "Nombre y apellido" });
    const err = h("p", { class: "error", hidden: true });
    const form = h("form", { class: "modal", onsubmit: e => {
        e.preventDefault();
        const nombre = input.value.trim().replace(/\s+/g, " ").slice(0, MAX_NAME);
        if (!nombre) { err.textContent = "Escribe un nombre."; err.hidden = false; input.focus(); return; }
        if (model(mod).active.some(p => norm(p.nombre) === norm(nombre))) { err.textContent = `${nombre} ya está en este departamento.`; err.hidden = false; input.focus(); return; }
        addPerson(mod, nombre); closeDialog();
      } },
      h("h2", {}, `Añadir persona · ${MODULES.find(m => m.key === mod).name}`),
      h("div", { class: "field" }, h("label", { for: "nuevo-nombre" }, "Nombre:"), input),
      err,
      h("button", { type: "submit", class: "primary block" }, "Agregar"),
      h("button", { type: "button", class: "ghost", onclick: closeDialog }, "Cancelar"));
    openDialog(form);
    input.focus();
  }

  function openMinus(p) {
    modal = { kind: "minus", mod: p.mod, pid: p.id, confirm: null };
    renderMinus();
  }
  // Lista numerada de las incidencias de la persona. Se vuelve a pintar con cada
  // cambio, así la numeración se corrige sola al quitar una.
  function renderMinus() {
    const M = model(modal.mod);
    const p = M.persons.find(x => x.id === modal.pid);
    if (!p) return closeDialog();
    const items = p.events.map((ev, i) => {
      const n = i + 1;
      const title = ev.razon || `Incidencia ${n}`;
      const meta = (ev.razon ? `Incidencia ${n} · ` : "") + when(ev.t);
      const actions = modal.confirm === ev.id
        ? h("div", { class: "inc-actions" },
            h("button", { type: "button", class: "danger", onclick: () => { removeEvent(p.mod, ev.id); modal.confirm = null; } }, "Sí, quitar"),
            h("button", { type: "button", class: "ghost", onclick: () => { modal.confirm = null; renderMinus(); } }, "No"))
        : h("div", { class: "inc-actions" },
            h("button", { type: "button", class: "ghost", onclick: () => { modal.confirm = ev.id; renderMinus(); } }, "Quitar"));
      return h("li", {}, h("div", { class: "inc-text" }, h("span", { class: "inc-title" }, title), h("span", { class: "inc-meta" }, meta)), actions);
    });
    openDialog(h("div", { class: "modal" },
      h("h2", {}, `¿Qué incidencia quitar? · ${p.nombre}`),
      items.length ? h("ul", { class: "inc-list" }, items) : h("p", { class: "hint" }, `${p.nombre} no tiene incidencias.`),
      h("div", { class: "modal-actions" }, h("button", { type: "button", class: "ghost", onclick: closeDialog }, "Cerrar"))));
  }

  // ---- navegación ----
  function go(key) {
    active = key; pendingRemove = null;
    try { history.replaceState(null, "", "#" + key); } catch (e) {}
    render();
  }
  function fromHash() {
    const k = location.hash.slice(1);
    return k === SUMMARY || MODULES.some(m => m.key === k) ? k : SUMMARY;
  }
  window.addEventListener("hashchange", () => go(fromHash()));

  // ---- pintado ----
  function renderTabs() {
    $("tabs").replaceChildren(
      h("button", { class: "tab", role: "tab", "aria-selected": String(active === SUMMARY), onclick: () => go(SUMMARY) }, "Resumen"),
      ...MODULES.map(m => h("button", { class: "tab", role: "tab", "aria-selected": String(active === m.key), onclick: () => go(m.key) },
        m.name, h("span", { class: "n", title: "Total histórico" }, String(model(m.key).totalHist))))
    );
  }

  const personLabel = p => p.activo ? p.nombre : `${p.nombre} (retirado)`;
  function leaderText(persons, field) {
    const max = Math.max(0, ...persons.map(p => p[field]));
    const names = max > 0 ? persons.filter(p => p[field] === max).map(personLabel) : [];
    return names.length ? `${names.join(", ")} (${max})` : "—";
  }

  // Reporte diario / semanal / mensual. Con varios departamentos añade su columna.
  function renderReport(mods) {
    if (!report.anchor) report.anchor = today();
    const { start, end, label } = periodRange(report.kind, report.anchor);
    const multi = mods.length > 1;
    const models = mods.map(k => ({ key: k, name: MODULES.find(m => m.key === k).name, M: model(k) }));
    const evs = models.flatMap(x => x.M.events.map(ev => ({ ...ev, depto: x.name })))
      .filter(ev => { const k = dayKey(ev.t); return k >= start && k <= end; })
      .sort((a, b) => b.t - a.t);

    const perPerson = new Map();
    for (const ev of evs) {
      const r = perPerson.get(ev.persona) || { p: ev.persona, depto: ev.depto, n: 0, conRazon: 0 };
      r.n++; if (ev.razon) r.conRazon++;
      perPerson.set(ev.persona, r);
    }
    const rows = [...perPerson.values()].sort((a, b) => b.n - a.n || a.p.nombre.localeCompare(b.p.nombre));
    const setKind = kind => { report.kind = kind; render(); };
    const kinds = [["dia", "Diario"], ["semana", "Semanal"], ["mes", "Mensual"]];

    return h("div", { class: "section" },
      h("div", { class: "section-head" }, h("h3", {}, "Reportes")),
      h("div", { class: "report-nav" },
        h("div", { class: "seg", role: "group", "aria-label": "Tipo de reporte" },
          kinds.map(([k, txt]) => h("button", { type: "button", "aria-pressed": String(report.kind === k), onclick: () => setKind(k) }, txt))),
        h("button", { type: "button", class: "icon-btn", "aria-label": "Periodo anterior", onclick: () => { report.anchor = shiftPeriod(report.kind, report.anchor, -1); render(); } }, "‹"),
        h("span", { class: "period" }, label),
        h("button", { type: "button", class: "icon-btn", "aria-label": "Periodo siguiente", onclick: () => { report.anchor = shiftPeriod(report.kind, report.anchor, 1); render(); } }, "›"),
        h("button", { type: "button", class: "ghost", onclick: () => { report.anchor = today(); render(); } }, "Actual")),
      evs.length
        ? [
            h("div", { class: "table-wrap" }, h("table", {},
              h("thead", {}, h("tr", {}, multi ? h("th", {}, "Departamento") : null, h("th", {}, "Persona"), h("th", { class: "num" }, "Incidencias"), h("th", { class: "num" }, "Con razón"))),
              h("tbody", {}, rows.map(r => h("tr", {}, multi ? h("td", {}, r.depto) : null, h("td", {}, personLabel(r.p)), h("td", { class: "num" }, String(r.n)), h("td", { class: "num" }, String(r.conRazon))))),
              h("tfoot", {}, h("tr", {}, multi ? h("th", {}) : null, h("th", {}, "Total"), h("th", { class: "num" }, String(evs.length)), h("th", { class: "num" }, String(evs.filter(e => e.razon).length)))))),
            h("div", { class: "table-wrap days" }, h("table", {},
              h("thead", {}, h("tr", {}, h("th", {}, "Fecha y hora"), multi ? h("th", {}, "Departamento") : null, h("th", {}, "Persona"), h("th", {}, "Razón"))),
              h("tbody", {}, evs.map(ev => h("tr", {},
                h("td", {}, when(ev.t)), multi ? h("td", {}, ev.depto) : null, h("td", {}, personLabel(ev.persona)),
                ev.razon ? h("td", { class: "reason" }, ev.razon) : h("td", { class: "reason muted" }, "Sin razón indicada"))))))
          ]
        : h("div", { class: "empty" }, `Sin incidencias en este periodo (${label}).`));
  }

  function renderSummary() {
    const rows = MODULES.map(m => ({ m, ...model(m.key) }));
    const grandHist = rows.reduce((s, r) => s + r.totalHist, 0);
    const grandHoy = rows.reduce((s, r) => s + r.totalHoy, 0);
    return h("section", { class: "wrap", style: "padding:0" },
      h("div", { class: "section-head" }, h("h2", {}, "Resumen general"), h("span", { class: "note" }, `Hoy es ${dayLabel(today())} (hora de Perú)`)),
      h("div", { class: "table-wrap" },
        h("table", {},
          h("thead", {}, h("tr", {},
            h("th", {}, "Departamento"), h("th", { class: "num" }, "Personas"),
            h("th", { class: "num" }, "Histórico"), h("th", { class: "num" }, "Hoy"),
            h("th", {}, "Más incidencias (histórico)"))),
          h("tbody", {}, rows.map(r => h("tr", {},
            h("td", {}, h("a", { href: "#" + r.m.key }, r.m.name)),
            h("td", { class: "num" }, String(r.active.length)),
            h("td", { class: "num" }, String(r.totalHist)),
            h("td", { class: "num" }, String(r.totalHoy)),
            h("td", {}, leaderText(r.persons, "total")))))
        )
      ),
      h("footer", {},
        h("span", { class: "total" }, "Total histórico: ", h("b", {}, String(grandHist))),
        h("span", { class: "total" }, "Hoy: ", h("b", {}, String(grandHoy)))),
      renderReport(MODULES.map(m => m.key))
    );
  }

  function renderCards(mod, M) {
    const max = Math.max(0, ...M.active.map(p => p.total));
    const leaders = M.active.filter(p => max > 0 && p.total === max);
    const q = norm(search[mod] || "");
    const shown = q ? M.active.filter(p => norm(p.nombre).includes(q)) : M.active;
    if (!shown.length) return h("div", { class: "empty" }, `Nadie coincide con «${search[mod]}».`);
    return h("div", { class: "board" }, shown.map(p => {
      const lead = leaders.includes(p);
      const key = mod + "/" + p.id;
      const countEl = h("div", { class: "count", "aria-live": "polite" }, String(p.total), h("small", {}, "en total"));
      if (lastShown[key] !== undefined && lastShown[key] !== p.total) countEl.classList.add("bump");
      lastShown[key] = p.total;

      const removeArea = pendingRemove === p.id
        ? h("div", { class: "remove-area" }, h("span", {}, `¿Quitar a ${p.nombre}? Su histórico se conserva.`),
            h("button", { class: "danger", onclick: () => archivePerson(mod, p.id) }, "Sí, quitar"),
            h("button", { class: "ghost", onclick: () => { pendingRemove = null; render(); } }, "Cancelar"))
        : h("button", { class: "link", onclick: () => { pendingRemove = p.id; render(); } }, "Quitar persona");

      return h("article", { class: "panel" + (lead ? " lead" : "") },
        h("div", { class: "row" }, h("span", { class: "name" }, p.nombre),
          lead ? h("span", { class: "tag" }, leaders.length > 1 ? "Empate" : "Más incidencias") : null),
        countEl,
        h("div", { class: "stats" }, h("span", { class: "chip" }, "Hoy ", h("b", {}, String(p.hoy)))),
        h("div", { class: "last" }, ago(p.last)),
        h("div", { class: "btns" },
          h("button", { class: "minus", title: "Elegir qué incidencia quitar", "aria-label": `Quitar una incidencia a ${p.nombre}`, disabled: !loaded || p.total === 0, onclick: () => openMinus(p) }, "−"),
          h("button", { class: "plus", disabled: !loaded, onclick: () => openPlus(p) }, "+1 incidencia")),
        removeArea);
    }));
  }

  function renderHistory(mod, M) {
    const cols = M.persons.filter(p => p.activo || p.total > 0);
    const keys = Object.keys(M.days).sort().reverse();
    const td = today();
    if (!keys.includes(td)) keys.unshift(td);
    const sel = selectedDay[mod] && keys.includes(selectedDay[mod]) ? selectedDay[mod] : keys[0];
    const cell = n => h("td", { class: "num" + (n ? "" : " zero") }, String(n || 0));

    const dayTable = h("div", { class: "table-wrap days" },
      h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Día"), cols.map(p => h("th", { class: "num" }, personLabel(p))), h("th", { class: "num" }, "Total"))),
        h("tbody", {}, keys.map(k => {
          const d = M.days[k] || { _total: 0 };
          return h("tr", { class: k === sel ? "sel" : "" },
            h("td", {}, h("button", { class: "daybtn", onclick: () => { selectedDay[mod] = k; render(); } }, k === td ? `Hoy · ${dayLabel(k)}` : dayLabel(k))),
            cols.map(p => cell(d[p.id])),
            cell(d._total));
        })),
        h("tfoot", {}, h("tr", {}, h("th", {}, "Total histórico"), cols.map(p => h("th", { class: "num" }, String(p.total))), h("th", { class: "num" }, String(M.totalHist))))
      ));

    const dsel = M.days[sel];
    const hours = dsel ? Object.keys(dsel.hours).map(Number).sort((a, b) => a - b) : [];
    const maxHour = Math.max(1, ...hours.map(hr => dsel.hours[hr]._total));
    const hourTable = hours.length
      ? h("div", { class: "table-wrap" },
          h("table", {},
            h("thead", {}, h("tr", {}, h("th", {}, "Hora (Perú)"), cols.map(p => h("th", { class: "num" }, personLabel(p))), h("th", {}, "Total"))),
            h("tbody", {}, hours.map(hr => {
              const hh = dsel.hours[hr];
              return h("tr", {}, h("td", {}, hourLabel(hr)), cols.map(p => cell(hh[p.id])),
                h("td", {}, h("span", { class: "bar", style: `width:${Math.round(hh._total / maxHour * 80)}px` }), String(hh._total)));
            }))))
      : h("div", { class: "empty" }, `Sin incidencias el ${dayLabel(sel)}.`);

    return [
      h("div", { class: "section" },
        h("div", { class: "section-head" }, h("h3", {}, "Histórico por día"), h("span", { class: "note" }, "Pulsa un día para ver el detalle por hora.")),
        cols.length ? dayTable : h("div", { class: "empty" }, "El histórico aparecerá aquí cuando haya personas e incidencias.")),
      h("div", { class: "section" },
        h("div", { class: "section-head" }, h("h3", {}, `Por hora · ${sel === td ? "Hoy" : dayLabel(sel)}`)),
        hourTable),
    ];
  }

  function renderModule(mod) {
    const m = MODULES.find(x => x.key === mod);
    const M = model(mod);

    const finder = h("input", { id: "buscar-" + mod, type: "search", placeholder: "Buscar persona…", "aria-label": "Buscar persona", autocomplete: "off",
      oninput: e => { search[mod] = e.target.value; render(); } });
    finder.value = search[mod] || "";

    return h("section", { class: "wrap", style: "padding:0" },
      h("div", { class: "module-head" }, h("h2", {}, m.name),
        h("div", { class: "add" }, finder, h("button", { class: "primary", type: "button", disabled: !loaded, onclick: () => openAdd(mod) }, "Añadir persona"))),
      M.active.length
        ? renderCards(mod, M)
        : h("div", { class: "empty" }, loaded ? `Todavía no hay nadie en ${m.name}. Pulsa «Añadir persona» para empezar.` : "Cargando…"),
      h("footer", {},
        h("span", { class: "total" }, `Total histórico de ${m.name}: `, h("b", {}, String(M.totalHist))),
        h("span", { class: "total" }, "Hoy: ", h("b", {}, String(M.totalHoy))),
        h("span", { class: "note" }, "«Hoy» vuelve a 0 cada día a las 00:00 (hora de Perú). Todo queda en el histórico.")),
      ...renderHistory(mod, M),
      renderReport([mod])
    );
  }

  function render() {
    // conservar lo que se está escribiendo y la posición de las tablas con scroll
    const focused = document.activeElement;
    const keepId = focused && focused.tagName === "INPUT" && !dlg.contains(focused) ? focused.id : null;
    const keepVal = keepId ? focused.value : null;
    const keepSel = keepId ? [focused.selectionStart, focused.selectionEnd] : null;
    const scrolls = [...document.querySelectorAll("#view .days")].map(el => el.scrollTop);

    renderTabs();
    $("view").replaceChildren(active === SUMMARY ? renderSummary() : renderModule(active));

    if (keepId && $(keepId)) {
      const el = $(keepId); el.value = keepVal; el.focus();
      try { el.setSelectionRange(...keepSel); } catch (e) {}
    }
    document.querySelectorAll("#view .days").forEach((el, i) => { if (scrolls[i]) el.scrollTop = scrolls[i]; });
    if (modal?.kind === "minus" && dlg.open) renderMinus();

    const status = $("status");
    if (!loaded) { status.dataset.mode = "connecting"; $("status-text").textContent = "Conectando…"; }
    else if (connected) { status.dataset.mode = "live"; $("status-text").textContent = "En directo"; }
    else { status.dataset.mode = "offline"; $("status-text").textContent = "Sin conexión"; }
  }

  onValue(ref(db, "equipos"), snap => { data = snap.val() || {}; loaded = true; render(); migrateLegacy(); }, fail);
  onValue(ref(db, ".info/connected"), snap => { connected = snap.val() === true; render(); });
  onValue(ref(db, ".info/serverTimeOffset"), snap => { serverOffset = Number(snap.val()) || 0; });

  active = fromHash();
  // repinta cada 30 s para «hace X min» y para el cambio de día a medianoche
  setInterval(() => { if (!pendingRemove && !dlg.open) render(); }, 30000);
  render();
</script>
</body>
</html>
