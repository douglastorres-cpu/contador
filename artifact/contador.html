<title>Contador de Cagadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
  /* Layout: tablero de incidencias de obra — cabecera con cinta de seguridad, tres paneles de marcador en fila que se apilan en móvil. */
  :root {
    --bg: #eceae4;
    --panel: #fbfaf7;
    --ink: #17161a;
    --muted: #625f58;
    --line: #d4d0c6;
    --hazard: #f2b705;
    --hazard-ink: #17161a;
    --plus: #1f7a3a;
    --minus: #b3261e;
    --lead-bg: #fff3c4;
    --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141417; --panel: #1e1e22; --ink: #f0eee8; --muted: #a29f97; --line: #34343a;
      --hazard: #f2b705; --hazard-ink: #17161a; --plus: #4caf6a; --minus: #e5554b; --lead-bg: #3a3014;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141417; --panel: #1e1e22; --ink: #f0eee8; --muted: #a29f97; --line: #34343a;
    --hazard: #f2b705; --hazard-ink: #17161a; --plus: #4caf6a; --minus: #e5554b; --lead-bg: #3a3014;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 0 40px;
  }
  .tape {
    height: 14px;
    margin-inline: -16px;
    background: repeating-linear-gradient(-45deg, var(--hazard) 0 18px, var(--hazard-ink) 18px 36px);
  }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding-top: 28px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.9rem, 6vw, 3rem);
    line-height: .95;
    text-transform: uppercase;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .sub { margin: 6px 0 0; color: var(--muted); }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-mode="live"] .dot { background: var(--plus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--plus) 25%, transparent); }
  .status[data-mode="local"] .dot, .status[data-mode="readonly"] .dot { background: var(--hazard); }

  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 680px) { .board { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    transition: background-color .2s, border-color .2s;
  }
  .panel.lead { background: var(--lead-bg); border-color: var(--hazard); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-family: var(--font-display); font-size: 1.25rem; text-transform: uppercase; overflow-wrap: anywhere; min-width: 0; }
  .tag {
    font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--hazard); color: var(--hazard-ink); padding: 3px 7px; border-radius: 3px; white-space: nowrap;
  }
  .count {
    font-family: var(--font-num); font-weight: 800;
    font-size: clamp(3.5rem, 12vw, 5rem); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .last { color: var(--muted); font-size: .85rem; min-height: 1.2em; }
  .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 5px;
    padding: 12px 10px; font-weight: 700; color: #fff;
    transition: transform .08s, opacity .2s;
  }
  button:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .minus { background: var(--minus); font-size: 1.5rem; line-height: 1; }
  .plus { background: var(--plus); font-size: 1rem; }

  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 2px solid var(--line); padding-top: 16px; }
  .total { font-weight: 600; }
  .total b { font-family: var(--font-num); }
  .reset-area { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); padding: 8px 14px; font-size: .9rem; }
  .danger { background: var(--minus); padding: 8px 14px; font-size: .9rem; }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }

  .bump { animation: bump .25s ease; }
  @keyframes bump { 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { .bump { animation: none; } button { transition: none; } }
</style>

<div class="tape" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Contador de Cagadas</h1>
      <p class="sub">Registro oficial de quién la ha liado más en la jornada.</p>
    </div>
    <span class="status" id="status" data-mode="connecting"><span class="dot"></span><span id="status-text">Conectando…</span></span>
  </header>

  <section class="board" id="board" aria-label="Marcador"></section>

  <footer>
    <span class="total">Total del equipo: <b id="total">0</b></span>
    <div class="reset-area">
      <button class="ghost" id="reset">Reiniciar a 0</button>
      <span id="confirm" hidden>
        <span class="note">¿Seguro? Se pone a 0 para todos.</span>
        <button class="danger" id="reset-yes">Sí, reiniciar</button>
        <button class="ghost" id="reset-no">Cancelar</button>
      </span>
    </div>
  </footer>
  <p class="note" id="note"></p>
</div>

<script>
(() => {
  const PEOPLE = [
    { key: "walter", name: "Walter" },
    { key: "cesar", name: "Cesar" },
    { key: "peter", name: "peterGAYmer" },
  ];
  const zeros = () => Object.fromEntries(PEOPLE.map(p => [p.key, 0]));

  // Estado compartido: cada persona que usa la página escribe solo su propio
  // documento (tallies/<id>) y el marcador suma todos. Así dos clics a la vez
  // desde ordenadores distintos nunca se pisan. "Reiniciar" cambia la época
  // en meta/state y solo cuentan los documentos de la época actual.
  let epoch = 0;
  let tallies = {};            // uid -> {epoch, counts, last}
  let myUid = null;
  let mine = { epoch: 0, counts: zeros(), last: {} };
  let mineLoaded = false;
  let mode = "connecting";     // connecting | live | local | readonly
  let db = null;

  const $ = id => document.getElementById(id);
  const board = $("board");
  const panels = {};

  PEOPLE.forEach(p => {
    const el = document.createElement("article");
    el.className = "panel";
    el.innerHTML = `
      <div class="row"><span class="name"></span><span class="tag" hidden>Va en cabeza</span></div>
      <div class="count" aria-live="polite">0</div>
      <div class="last"></div>
      <div class="btns">
        <button class="minus" aria-label="Restar una a ${p.name}">−</button>
        <button class="plus">+1 cagada</button>
      </div>`;
    el.querySelector(".name").textContent = p.name;
    el.querySelector(".plus").addEventListener("click", () => change(p.key, 1));
    el.querySelector(".minus").addEventListener("click", () => change(p.key, -1));
    board.appendChild(el);
    panels[p.key] = el;
  });

  function current() {
    const docs = { ...tallies };
    if (myUid) docs[myUid] = mine;
    const counts = zeros(), last = {};
    for (const d of Object.values(docs)) {
      if (!d || d.epoch !== epoch) continue;
      for (const p of PEOPLE) {
        counts[p.key] += Number(d.counts?.[p.key]) || 0;
        const t = Number(d.last?.[p.key]) || 0;
        if (t > (last[p.key] || 0)) last[p.key] = t;
      }
    }
    for (const p of PEOPLE) counts[p.key] = Math.max(0, counts[p.key]);
    return { counts, last };
  }

  function ago(t) {
    if (!t) return "";
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return "Última: hace un momento";
    const m = Math.round(s / 60);
    if (m < 60) return `Última: hace ${m} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `Última: hace ${h} h`;
    return `Última: hace ${Math.round(h / 24)} días`;
  }

  function render() {
    const { counts, last } = current();
    const max = Math.max(...PEOPLE.map(p => counts[p.key]));
    const leaders = PEOPLE.filter(p => counts[p.key] === max);
    const canWrite = mode !== "readonly" && mode !== "connecting";
    PEOPLE.forEach(p => {
      const el = panels[p.key];
      const lead = max > 0 && leaders.includes(p);
      el.classList.toggle("lead", lead);
      const tag = el.querySelector(".tag");
      tag.hidden = !lead;
      tag.textContent = leaders.length > 1 ? "Empate en cabeza" : "Va en cabeza";
      const c = el.querySelector(".count");
      if (c.textContent !== String(counts[p.key])) {
        c.textContent = counts[p.key];
        c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
      }
      el.querySelector(".last").textContent = ago(last[p.key]);
      el.querySelector(".plus").disabled = !canWrite;
      el.querySelector(".minus").disabled = !canWrite || counts[p.key] === 0;
    });
    $("total").textContent = PEOPLE.reduce((s, p) => s + counts[p.key], 0);
    $("reset").disabled = !canWrite;
  }

  function setMode(m, text, note = "") {
    mode = m;
    $("status").dataset.mode = m;
    $("status-text").textContent = text;
    $("note").textContent = note;
    render();
  }

  // ---- escritura (una a la vez, agrupando clics rápidos) ----
  let writing = false, dirty = false;
  async function flush() {
    if (mode === "local") { saveLocal(); return; }
    if (writing) { dirty = true; return; }
    writing = true;
    try {
      do {
        dirty = false;
        await db.doc("tallies/" + myUid).set(JSON.parse(JSON.stringify(mine)));
      } while (dirty);
    } catch (e) {
      if (e && e.code === "invalid_argument") {
        setMode("readonly", "Solo lectura", "Puedes ver el marcador, pero no tienes permiso para apuntar. Pide acceso de colaborador a quien te pasó el enlace.");
      } else {
        $("note").textContent = "No se pudo guardar el último cambio. Vuelve a pulsar en unos segundos.";
      }
    } finally {
      writing = false;
    }
  }

  function change(key, delta) {
    if (mode === "readonly" || mode === "connecting") return;
    const { counts } = current();
    if (counts[key] + delta < 0) return;
    if (mine.epoch !== epoch) mine = { epoch, counts: zeros(), last: {} };
    mine = { ...mine, counts: { ...mine.counts, [key]: (mine.counts[key] || 0) + delta }, last: { ...mine.last } };
    if (delta > 0) mine.last[key] = Date.now();
    render();
    flush();
  }

  // ---- reinicio con confirmación en la propia página ----
  $("reset").addEventListener("click", () => { $("reset").hidden = true; $("confirm").hidden = false; });
  $("reset-no").addEventListener("click", () => { $("confirm").hidden = true; $("reset").hidden = false; });
  $("reset-yes").addEventListener("click", async () => {
    $("confirm").hidden = true; $("reset").hidden = false;
    const next = Date.now();
    if (mode === "local") {
      epoch = next; mine = { epoch, counts: zeros(), last: {} }; saveLocal(); render(); return;
    }
    try {
      epoch = next;
      mine = { epoch, counts: zeros(), last: {} };
      render();
      await db.doc("meta/state").set({ epoch: next });
      flush();
    } catch (e) {
      $("note").textContent = "No se pudo reiniciar. Inténtalo otra vez.";
    }
  });

  // ---- modo local (fuera de claude.ai) ----
  const LS = "contador-cagadas-v2";
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({ epoch, mine })); } catch (e) {} }
  function startLocal() {
    try {
      const s = JSON.parse(localStorage.getItem(LS));
      if (s && s.mine) { epoch = s.epoch || 0; mine = s.mine; }
    } catch (e) {}
    myUid = "local";
    setMode("local", "Solo este navegador", "No hay conexión con el marcador compartido: los cambios solo se guardan en este navegador.");
  }

  // ---- arranque en tiempo real ----
  async function start() {
    render();
    if (!window.claude || typeof window.claude.use !== "function") return startLocal();
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!dbNs || !uid) return startLocal();
    db = dbNs; myUid = uid;

    db.doc("meta/state").onSnapshot(snap => {
      const e = snap.exists ? Number(snap.data().epoch) || 0 : 0;
      if (e !== epoch) {
        epoch = e;
        if (mine.epoch !== epoch && mine.epoch < epoch) mine = { epoch, counts: zeros(), last: {} };
      }
      render();
    }, () => setMode("local", "Sin conexión", "Se perdió la conexión con el marcador. Recarga la página."));

    db.collection("tallies").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      tallies = next;
      if (!mineLoaded) {
        mineLoaded = true;
        if (next[myUid]) mine = JSON.parse(JSON.stringify(next[myUid]));
        setMode("live", "En directo");
        Promise.resolve(user.can ? user.can("data.write") : null).then(ok => {
          if (ok === false) setMode("readonly", "Solo lectura", "Puedes ver el marcador, pero no tienes permiso para apuntar. Pide acceso de colaborador a quien te pasó el enlace.");
        }).catch(() => {});
      } else {
        render();
      }
    }, () => setMode("local", "Sin conexión", "Se perdió la conexión con el marcador. Recarga la página."));
  }

  setInterval(render, 30000);
  start();
})();
</script>
